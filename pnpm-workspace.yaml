# Settings duplicated from package.json's `pnpm` block on purpose. pnpm 10 —
# the version CI installs, pinned by shared-workflows node-test.yml — reads
# `overrides` and `onlyBuiltDependencies` from package.json and ignores this
# file. pnpm 11+ is the reverse: it ignores the package.json block entirely
# ("The \"pnpm\" field in package.json is no longer read by pnpm") and reads
# only this file. Keeping both homes is what lets the same checkout install
# under either major. The two MUST stay in sync: whichever pnpm finds no
# overrides regenerates pnpm-lock.yaml without its top-level `overrides:`
# block, and every later --frozen-lockfile then fails with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  brace-expansion: '>=5.0.9'
  immutable: '>=5.1.8'

# pnpm 11 spelling.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp

# pnpm 12 spelling. Without it pnpm 12 refuses the install with
# ERR_PNPM_IGNORED_BUILDS, which takes .githooks/pre-commit down with it.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
