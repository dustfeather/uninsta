# The single home for pnpm settings. pnpm reads them from here on every version
# CI or a contributor is likely to run: 10.6+ honours this file, and 11+ reads
# ONLY this file, having dropped the `pnpm` field in package.json ("The \"pnpm\"
# field in package.json is no longer read by pnpm"). A pnpm that finds no
# overrides regenerates pnpm-lock.yaml without its top-level `overrides:` block,
# and every later --frozen-lockfile then fails with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH -- which is how the Dependabot PRs this
# replaced were breaking.
overrides:
  brace-expansion: '>=5.0.9'
  immutable: '>=5.1.8'

# pnpm 10's spelling of the build-script allowlist, kept only for a contributor
# still on that major. CI is on 11.19.0, which does not read this block at all.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp

# pnpm 11.0.0 renamed it, and 12 kept the new name. This is the block that is
# live on CI; without it, install stops at ERR_PNPM_IGNORED_BUILDS and takes
# .githooks/pre-commit down with it. The comment above used to put the rename
# at 12, which made the list above look like the one pnpm 11 reads. Counted in
# the shipped bundles: pnpm 10.20.0 has 0 references to allowBuilds and 35 to
# onlyBuiltDependencies, 11.0.0 has 77 and 0, 11.19.0 has 87 and 3 -- and those
# three are its legacy-key migration list plus one error hint, not a read.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
