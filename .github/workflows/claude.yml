name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# A burst of comments on one issue or PR should cost one run, not one run
# each. Keyed on the issue/PR rather than the ref because the triggering
# events are comment events: `issue_comment` and `issues` carry
# `issue.number` (a PR comment is an issue comment, so this covers PRs too),
# `pull_request_review` and `pull_request_review_comment` carry
# `pull_request.number` and no `issue`, and `github.ref` is a fallback that
# should never be reached. Cancelling is right here: the agent answers the
# latest comment, so an in-flight run against an older one is already stale.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    uses: dustfeather/shared-workflows/.github/workflows/claude.yml@v7
    with:
      # Deliberately not this repo's ARC pool. Every pool schedules onto the
      # same 4-core node, where each runner pod reserves 1000m as IO admission
      # control, so the cluster admits two runner pods at a time in total. An
      # interactive Claude session is minutes of API wait rather than local CPU
      # or disk, so parking it on a self-hosted runner holds half the cluster's
      # CI budget for work the node contributes nothing to, and real test jobs
      # queue behind it. (ITGuys-RO/k3s-cluster#16)
      runner: ubuntu-latest
    secrets: inherit
