name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    uses: dustfeather/shared-workflows/.github/workflows/release-extension.yml@v4
    with:
      runner: arc-df-uninsta
      targets: '["chrome","firefox"]'
      addon-id: uninsta@dustfeather
    secrets: inherit
