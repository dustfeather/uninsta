name: Release

# No workflow merges PRs any more, so every merge to main raises a push
# event. The `workflow_run` branches in the `if:` expressions below date from
# the bot-merge shims and are unreachable now; a push passes them.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    # On the push path there is nothing to check. On the workflow_run path,
    # only a successful merge run means `main` actually moved — a shim whose
    # job was skipped still completes `success` at the RUN level, but its
    # gates above mean it only runs when a merge is really happening.
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    uses: dustfeather/shared-workflows/.github/workflows/release-extension.yml@v10
    with:
      runner: arc-df-uninsta
      targets: '["chrome","firefox","userscript"]'
      addon-id: uninsta@dustfeather
    secrets: inherit
