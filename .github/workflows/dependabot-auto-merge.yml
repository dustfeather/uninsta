name: Dependabot auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  merge:
    # Duplicates the reusable workflow's own author/state test on purpose.
    # That one decides whether to MERGE; this one whether this workflow RUNS.
    # A filtered-out run concludes `skipped`, which `release.yml`'s
    # `conclusion == 'success'` guard already drops — this keeps the run from
    # being created at all.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      # Granted ahead of the callee requesting it. shared-workflows'
      # dependabot-auto-merge closes the PR's linked issues itself after a
      # `direct` merge, and that write needs this scope — without it a merged
      # `Closes #N` stores the link and silently never closes.
      #
      # A caller may always grant MORE than the callee asks; a callee asking
      # for more than the caller grants is a startup_failure with zero jobs and
      # an empty `--log-failed`. So this lands FIRST, in every caller, before
      # the scope is added to the reusable workflow.
      issues: write
    uses: dustfeather/shared-workflows/.github/workflows/dependabot-auto-merge.yml@v5
    with:
      runner: arc-df-uninsta
      # `direct` so the merge lands inside this run — see the same comment in
      # merge-on-approval.yml. `release.yml` reacts to this run finishing.
      mode: direct
