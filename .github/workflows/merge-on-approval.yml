name: Merge on approval

# When a PR gets an approving review — including the approval the
# claude-code-review job submits as claude[bot] via `gh pr review --approve`
# — land it via the shared reusable workflow (rebase-merge, auto mode).
# claude[bot] is a GitHub App, so its review DOES trigger this workflow
# (only the default GITHUB_TOKEN is blocked from cascading events).

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  merge:
    # This gate duplicates, on purpose, filters the reusable workflow already
    # applies internally. The inner `if:` decides whether to MERGE; this one
    # decides whether this workflow RUNS at all. `release.yml` keys off this
    # run and guards on `conclusion == 'success'`; a run whose only job is
    # filtered out concludes `skipped`, so that guard already drops it. This
    # gate stops the pointless run existing, and keeps the intent readable
    # next to the trigger.
    #
    # The author test also closes a real hole: this repo is public and `main`
    # is unprotected, so without it any account could submit an approving
    # review on any open PR and land it. `claude[bot]` is named explicitly
    # because the review agent's `author_association` is NONE, not
    # OWNER/MEMBER/COLLABORATOR — the association test alone would reject the
    # very approval this workflow exists for.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      (github.event.review.user.login == 'claude[bot]' ||
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    permissions:
      contents: write
      pull-requests: write
      # Required for a merged `Closes #N` to actually close the issue. GitHub
      # computes the link for free, but EXECUTING the close is a write to the
      # Issues API attributed to whoever performed the merge — and this merge is
      # performed by GITHUB_TOKEN inside the reusable workflow. Without this scope
      # the link is stored and the close silently never runs, with no warning and
      # a green workflow. Granted here BEFORE the reusable workflow asks for it:
      # a caller may always grant more than the callee needs, but a callee asking
      # for more than a caller grants is a startup_failure with zero jobs.
      issues: write
    uses: dustfeather/shared-workflows/.github/workflows/merge-on-approval.yml@v5
    with:
      runner: arc-df-uninsta
      # `direct`, not the reusable workflow's `auto` default. `release.yml`
      # keys off THIS run finishing, and `--auto` hands the merge to GitHub
      # and returns straight away — so the job could complete, raising
      # `workflow_run`, while `main` is still the pre-merge commit and the
      # release would build the wrong tree. `direct` merges inside the step,
      # so the run only completes once `main` has actually moved.
      mode: direct
